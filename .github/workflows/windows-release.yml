name: Windows x64 · test, package and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Simulate full gameplay and test GUI
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --junitxml=qa-output/tests.xml
      - name: Capture six environments during day and night
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/validate.py --output qa-output/visual
      - name: Build real Windows executable
        run: python -m PyInstaller --noconfirm --clean IdleFarm.spec
      - name: Smoke-test the Windows executable and compute SHA-256
        # Default Windows platform plugin: exercises qwindows.dll as a player would.
        run: python tools/smoke_exe.py dist/IdleFarm.exe --output qa-output/packaged
      - name: Upload executable and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IdleFarm-Windows-x64
          path: |
            dist/IdleFarm.exe
            dist/SHA256SUMS.txt
            qa-output/
          if-no-files-found: error
      - name: Publish tagged version after all checks pass
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $notes = @'
          Primeira versão jogável do IdleFarm: cinco culturas, cinco instalações, doze espécies/raças, seis ambientes em pixel art, progresso offline e salvamento persistente.

          Windows 64 bits. Baixe IdleFarm.exe e abra com dois cliques, sem Python e sem internet. O progresso fica em %APPDATA%\IdleFarm\save.json.

          O executável foi gerado e iniciado duas vezes neste executor Windows, em pasta temporária e com save isolado. SHA256SUMS.txt contém o checksum. Evidências de testes, capturas e smoke test estão no artefato desta execução.
          '@
          $notes | Set-Content -Encoding utf8 release-notes.md
          gh release create $tag dist/IdleFarm.exe dist/SHA256SUMS.txt --verify-tag --title "IdleFarm $tag" --notes-file release-notes.md
