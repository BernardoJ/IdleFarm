name: Windows x64 · test, package and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      IDLEFARM_BUILD_COMMIT: ${{ github.sha }}
      PYTHONUTF8: '1'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Simulate full gameplay and test GUI
        env:
          QT_QPA_PLATFORM: windows
        run: python -m pytest -q --junitxml=qa-output/tests.xml
      - name: Capture environments and experience dialogs at four DPI scales
        env:
          # Use the player's native font database; offscreen can render only tofu on Windows.
          QT_QPA_PLATFORM: windows
        shell: pwsh
        run: |
          foreach ($scale in @('1', '1.25', '1.5', '2')) {
            $env:QT_SCALE_FACTOR = $scale
            python tools/validate.py --output "qa-output/visual-$scale"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python tools/validate_experience.py --output "qa-output/experience-$scale"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Remove-Item Env:QT_SCALE_FACTOR
      - name: Build real Windows executable
        run: python -m PyInstaller --noconfirm --clean IdleFarm.spec
      - name: Measure bounded rendering across a visual day
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/benchmark.py --output qa-output/performance.json
      - name: Smoke-test the Windows executable and compute SHA-256
        # Default Windows platform plugin: exercises qwindows.dll as a player would.
        run: python tools/smoke_exe.py dist/IdleFarm.exe --output qa-output/packaged
      - name: Upload executable and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IdleFarm-Windows-x64
          path: |
            dist/IdleFarm.exe
            dist/SHA256SUMS.txt
            qa-output/
          if-no-files-found: error
      - name: Publish tagged preview for final visual inspection
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          gh release create $tag dist/IdleFarm.exe dist/SHA256SUMS.txt qa-output/packaged/executable.json qa-output/packaged/packaged-window.png qa-output/performance.json qa-output/experience-1/management-filter.png qa-output/experience-1.25/batch-confirmation.png qa-output/experience-2/recovery-details.png --verify-tag --prerelease --latest=false --title "IdleFarm $tag" --notes-file docs/RELEASE_NOTES.md
